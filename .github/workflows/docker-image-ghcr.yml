name: Publish image to GHCR

# Builds a SciLifeLab Serve compatible image and publishes it to the GitHub
# Container Registry on every push to main. The tag is unique on every run,
# because Serve refuses to re-pull a tag it has already deployed.
#
# After the first successful run, make the package public:
#   repository -> Packages -> your package -> Package settings -> Change visibility
# Serve can only pull public images.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  preflight:
    # Never publish an image that breaks the deployment contract.
    uses: ./.github/workflows/preflight.yml

  build-and-push:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute a unique image tag
        # Timestamp plus short SHA. Unique per build, sorts chronologically,
        # and matches the format used by the SciLifeLab example apps
        # (for example gradio-flower-classification:20231220-114734).
        run: echo "TAG=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Lowercase the image name
        # GHCR rejects uppercase repository names.
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the value to paste into the Serve form
        run: |
          {
            echo "### Image published"
            echo ""
            echo '```'
            echo "${IMAGE}:${TAG}"
            echo '```'
            echo ""
            echo "Paste that into the **Image** field of the SciLifeLab Serve app form,"
            echo "with **Port** 7860. See DEPLOY.md for the remaining fields."
            echo ""
            echo "Remember to make the package public the first time."
          } >> "$GITHUB_STEP_SUMMARY"
